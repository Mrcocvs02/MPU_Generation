[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mpu_generators"
version = "0.2.0"
description = "Certified random generators for Matrix Product Unitaries (Mode I/II/II-B, translationally invariant and general)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Marco Vassallo", email = "marco.vassallo02@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "TreeMPU>=0.2",  # not on PyPI: install TreeMPU from its repository first (see README)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff",
]

[project.urls]
Repository = "https://github.com/Mrcocvs02/MPU_Generation"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
